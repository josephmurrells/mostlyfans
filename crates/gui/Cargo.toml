[package]
name = "fanforge-gui"
description = "FanForge desktop app: controls the fans while it runs, from the window or the tray."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "fanforge"
path = "src/main.rs"

[dependencies]
fanforge-core.workspace = true
fanforge-control.workspace = true
fanforge-hw.workspace = true
fanforge-win.workspace = true
clap.workspace = true
eframe.workspace = true
ron.workspace = true
serde.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
tray-icon.workspace = true

[build-dependencies]
embed-manifest = "1.4"
embed-resource = "3"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
tempfile.workspace = true

[lints]
workspace = true
